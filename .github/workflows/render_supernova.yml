name: Render Supernova Cosmic MP4

on:
  workflow_dispatch:
  push:
    branches:
      - prueba

permissions:
  contents: write

jobs:
  render-supernova:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment (Python & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-numpy

      - name: Render Video Supernova Cósmica
        run: |
          python3 render_supernova_cosmic.py
          ls -lh video_supernova_cosmica.mp4

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-supernova-cosmica-mp4
          path: video_supernova_cosmica.mp4
          retention-days: 14
