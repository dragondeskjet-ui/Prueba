name: Render Visualizer MP4

on:
  workflow_dispatch:
  push:
    branches:
      - prueba

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential

      - name: Compile C Visualizer
        run: |
          gcc -O3 -Wall itunes_winamp_visualizer.c -o visualizer_c -lm

      - name: Adapt script to system FFmpeg
        run: |
          sudo ln -sf /usr/bin/ffmpeg /tmp/ffmpeg

      - name: Render MP4 Video
        run: |
          ./visualizer_c
          ls -lh cancion_itunes_winamp.mp4

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cancion-itunes-winamp-video
          path: cancion_itunes_winamp.mp4
          retention-days: 14
